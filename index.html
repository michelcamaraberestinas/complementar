<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lux & Co. Consulting | Material Complementar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --navy: #1B2A4A;
    --navy-soft: #263557;
    --gold: #C5A55A;
    --gold-light: #D4BA7A;
    --cream: #FAF8F5;
    --cream-warm: #F5F0E8;
    --text: #3A3A4A;
    --text-light: #6B6B7B;
    --border: #E8E4DD;
    --white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: var(--navy);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-area img {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .logo-text h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
    letter-spacing: 2px;
  }

  .logo-text p {
    font-size: 10px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 22px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
    letter-spacing: 0.3px;
  }

  .btn-save {
    background: var(--gold);
    color: var(--navy);
  }
  .btn-save:hover { background: var(--gold-light); }

  .btn-clear {
    background: transparent;
    border: 1px solid #555;
    color: #aaa;
  }
  .btn-clear:hover { border-color: #999; color: #ddd; }

  .btn-pdf {
    background: var(--navy-soft);
    color: var(--gold);
    border: 1px solid var(--gold);
  }
  .btn-pdf:hover { background: #3A4A6A; }

  .btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .subtitle-bar {
    background: var(--cream-warm);
    border-bottom: 1px solid var(--border);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .subtitle-bar h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: 0.5px;
  }

  .subtitle-bar .date {
    font-size: 12px;
    color: var(--text-light);
  }

  .main {
    max-width: 900px;
    margin: 32px auto;
    padding: 0 24px 60px;
  }

  .editor-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  .editor-label {
    padding: 16px 24px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .editor-label .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
  }

  .editor-label span {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-light);
  }

  .editor {
    min-height: 500px;
    padding: 28px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    outline: none;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .editor:empty::before {
    content: 'Cole aqui as soluções, conselhos e dicas da IA como material complementar do seu diagnóstico do Básico Bem Feito...';
    color: #B5B0A8;
    font-style: italic;
  }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 0.5px;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--navy);
    color: var(--white);
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.35s ease;
    z-index: 999;
    border-left: 3px solid var(--gold);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 600px) {
    .header { padding: 16px; }
    .actions { width: 100%; justify-content: stretch; }
    .btn { flex: 1; justify-content: center; padding: 10px 12px; font-size: 12px; }
    .subtitle-bar { padding: 12px 16px; flex-direction: column; align-items: flex-start; gap: 4px; }
    .main { padding: 0 12px 40px; margin-top: 20px; }
    .editor { padding: 20px; font-size: 14px; min-height: 400px; }
  }
</style>
</head>

  document.getElementById('logoImg').src = "data:image/png;base64," + LOGO_B64;

  const now = new Date();
  const options = { day: '2-digit', month: 'long', year: 'numeric' };
  document.getElementById('currentDate').textContent = now.toLocaleDateString('pt-BR', options);

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function saveContent() {
    const content = document.getElementById('editor').innerHTML;
    localStorage.setItem('luxco_notes', content);
    showToast('Conteúdo salvo com sucesso!');
  }

  function loadContent() {
    const saved = localStorage.getItem('luxco_notes');
    if (saved) document.getElementById('editor').innerHTML = saved;
  }

  function clearContent() {
    if (confirm('Tem certeza que deseja limpar todo o conteúdo?')) {
      document.getElementById('editor').innerHTML = '';
      localStorage.removeItem('luxco_notes');
      showToast('Conteúdo limpo.');
    }
  }

  function exportPDF() {
    const editorContent = document.getElementById('editor').innerHTML;
    if (!editorContent.trim()) {
      showToast('Nada para exportar. Preencha o campo primeiro.');
      return;
    }

    const dateStr = now.toLocaleDateString('pt-BR', options);

    const pdfContainer = document.createElement('div');
    pdfContainer.innerHTML = `
      <div style="padding: 40px; font-family: 'Inter', Helvetica, sans-serif; color: #3A3A4A;">
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 8px;">
          <img src="data:image/png;base64,${LOGO_B64}" style="width: 50px; height: 50px; border-radius: 50%;" />
          <div>
            <div style="font-family: Georgia, serif; font-size: 20px; font-weight: 600; color: #1B2A4A; letter-spacing: 2px;">LUX & CO.</div>
            <div style="font-size: 9px; font-weight: 600; color: #C5A55A; letter-spacing: 3px; text-transform: uppercase;">Consulting</div>
          </div>
        </div>
        <div style="border-bottom: 2px solid #C5A55A; margin: 16px 0 20px;"></div>
        <div style="font-family: Georgia, serif; font-size: 15px; font-weight: 600; color: #1B2A4A; margin-bottom: 4px;">
          Material Complementar / Diagnóstico do Básico Bem Feito
        </div>
        <div style="font-size: 11px; color: #6B6B7B; margin-bottom: 24px;">
          ${dateStr}
        </div>
        <div style="font-size: 13px; line-height: 1.8; white-space: pre-wrap; color: #3A3A4A;">
          ${editorContent}
        </div>
        <div style="border-top: 1px solid #E8E4DD; margin-top: 40px; padding-top: 14px; text-align: center; font-size: 10px; color: #999; letter-spacing: 0.5px;">
          Lux & Co. Consulting · Think sharp. Move smart.
        </div>
      </div>
    `;

    const opt = {
      margin: 0,
      filename: 'LuxCo_Material_Complementar.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(pdfContainer).save().then(() => {
      showToast('PDF exportado!');
    });
  }

  loadContent();
</script>
